<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tipos de redes</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: "Segoe UI", Helvetica, Arial, sans-serif;
    background: #efefef;
    color: #111;
    padding: 20px;
  }

  .instructions {
    font-weight: 700;
    font-size: 17px;
    margin-bottom: 20px;
  }

  .carousel {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 40px;
    align-items: start;
  }

  /* ---------- Image side ---------- */
  .viewport {
    overflow: hidden;
    background: #fff;
    aspect-ratio: 4 / 3;
    width: 100%;
  }
  .track {
    display: flex;
    height: 100%;
    transition: transform 0.5s ease;
  }
  .slide-img {
    flex: 0 0 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .slide-img img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
  }
  .placeholder {
    width: 100%;
    height: 100%;
    border: 2px dashed #b5c7d3;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: #6b8799;
    font-size: 14px;
    padding: 20px;
  }

  /* ---------- Text side ---------- */
  .side { display: flex; flex-direction: column; }

  .controls {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 16px;
    margin-bottom: 40px;
  }
  .dots { display: flex; gap: 8px; margin-right: auto; margin-left: auto; }
  .dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    border: none;
    background: #d4d4d4;
    cursor: pointer;
    transition: background 0.3s, transform 0.3s;
  }
  .dot.active { background: #049fd9; transform: scale(1.15); }

  .arrow {
    width: 64px; height: 68px;
    border: 1px solid #ddd;
    border-radius: 6px;
    background: #fff;
    font-size: 22px;
    cursor: pointer;
    transition: background 0.2s, opacity 0.2s;
  }
  .arrow:hover:not(:disabled) { background: #f5f5f5; }
  .arrow:disabled { opacity: 0; pointer-events: none; }

  .text { padding-left: 40px; }
  .text h2 { font-size: 18px; margin-bottom: 22px; }
  .text p  { font-size: 18px; line-height: 1.65; }
  .text.fade { animation: fade 0.45s ease; }
  @keyframes fade {
    from { opacity: 0; transform: translateX(20px); }
    to   { opacity: 1; transform: translateX(0); }
  }

  /* ---------- Mobile ---------- */
  @media (max-width: 700px) {
    .carousel { grid-template-columns: 1fr; gap: 20px; }
    .controls { margin-bottom: 20px; }
    .text { padding-left: 0; }
    .text p { font-size: 16px; }
  }
</style>
</head>
<body>

<p class="instructions">Seleccione las flechas izquierda y derecha para obtener más información sobre los diferentes tipos de redes.</p>

<div class="carousel">
  <div class="viewport"><div class="track" id="track"></div></div>

  <div class="side">
    <div class="controls">
      <button class="arrow" id="prev" aria-label="Anterior">&#10094;</button>
      <div class="dots" id="dots"></div>
      <button class="arrow" id="next" aria-label="Siguiente">&#10095;</button>
    </div>
    <div class="text" id="text"></div>
  </div>
</div>

<script>
/* =========================================================
   EDIT YOUR SLIDES HERE
   - image: path to the image file (inside the "images" folder)
   - title: the heading on the right
   - text:  the description (you can use <b>bold</b>)
   Add or remove slides by copying/deleting a { ... }, block.
   ========================================================= */
const slides = [
   {
    image: "images/pan.png",
    title: "PAN",
    text: "Una <b>red de área personal (PAN)</b> es una red que conecta dispositivos, como mouse, teclados, impresoras, teléfonos inteligentes y tabletas, dentro del alcance de una persona. Estos dispositivos están conectados a menudo con tecnología Bluetooth. Bluetooth es una tecnología inalámbrica que permite la comunicación entre dispositivos en distancias cortas."
  },
  {
    image: "images/lan.png",
    title: "LAN",
    text: "Tradicionalmente, una <b>red de área local (LAN)</b> se define como una red que conecta dispositivos mediante cables en un área geográfica pequeña. Sin embargo, la característica que diferencia a las LAN en la actualidad es que normalmente son propiedad de una persona (por ejemplo, en un hogar o una pequeña empresa), o son administrados completamente por un departamento de TI, (por ejemplo, en una escuela o una corporación)."
  },
  {
    image: "images/vlan.png",
    title: "VLAN",
    text: "<b>Las LAN virtuales (VLAN)</b> permiten que un administrador segmente los puertos en un solo conmutador como si fuesen conmutadores múltiples. Esto proporciona un reenvío más eficaz de los datos al aislar el tráfico solo a aquellos puertos en los que se requiere. Las VLAN también permiten agrupar dispositivos finales para fines administrativos. En el diagrama, la VLAN 2 crea una LAN virtual para los equipos de TI, incluso en diferentes pisos, y puede tener permisos de red diferentes que las otras VLAN."
  },
  {
    image: "images/wlan.png",
    title: "WLAN",
    text: "Una <b>LAN inalámbrica (WLAN)</b> es similar a una LAN, pero conecta de manera inalámbrica a los usuarios y dispositivos en un área geográfica pequeña en lugar de utilizar una conexión cableada. Una WLAN utiliza ondas de radio para transmitir datos entre dispositivos inalámbricos."
  },
  {
    image: "images/wmn.png",
    title: "WMN",
    text: "Una <b>red de malla inalámbrica (WMN)</b> utiliza varios puntos de acceso para extender la WLAN. La topología muestra un enrutador inalámbrico. Los dos puntos de acceso inalámbricos amplían el alcance de la WLAN dentro del hogar. De manera similar, las empresas y los municipios pueden utilizar WMN para agregar rápidamente nuevas áreas de cobertura."
  },
 {
    image: "images/can.png",
    title: "CAN",
    text: "Una <b>red de área de campus (CAN)</b> es un grupo de LAN interconectadas, pertenecientes a la misma organización y que operan en un área geográfica limitada. Estos pueden ser tanto campus académicos como campus empresariales o corporativos. Las redes de área de campus generalmente consisten en varios edificios interconectados por enlaces Ethernet de alta velocidad que utilizan cableado de fibra óptica. La figura muestra tres redes de área de campus de diferentes tamaños"
  },
 {
    image: "images/wan.png",
    title: "WAN",
    text: "Una <b>red de área extensa (WAN)</b> conecta varias redes que se encuentran geográficamente separadas. Las personas y las organizaciones contratan el acceso a la WAN de un proveedor de servicios. El proveedor de servicios de su dispositivo móvil o doméstico lo conecta con la WAN más grande, Internet. En la figura, las redes de Tokio y de Moscú están conectadas a través de Internet."
  },
 {
    image: "images/vpn.png",
    title: "VPN",
    text: "Una <b>red privada virtual (VPN)</b> se utiliza para conectarse de forma segura a otra red a través de una red insegura, como Internet. Los teletrabajadores utilizan el tipo más común de VPN para acceder a una red privada corporativa. Los teletrabajadores son usuarios de la red que están fuera del sitio o remotos. En la figura, el enlace grueso entre el Teleworker en DSL y el enrutador en Headquarters representan una conexión VPN."
  },
];

/* ---------- Carousel logic (no need to edit) ---------- */
const track = document.getElementById("track");
const dotsBox = document.getElementById("dots");
const textBox = document.getElementById("text");
const prevBtn = document.getElementById("prev");
const nextBtn = document.getElementById("next");
let current = 0;

slides.forEach((s, i) => {
  const wrap = document.createElement("div");
  wrap.className = "slide-img";
  const img = document.createElement("img");
  img.src = s.image;
  img.alt = s.title;
  img.onerror = () => {
    wrap.innerHTML = '<div class="placeholder">Imagen no encontrada:<br>' + s.image + '</div>';
  };
  wrap.appendChild(img);
  track.appendChild(wrap);

  const dot = document.createElement("button");
  dot.className = "dot";
  dot.setAttribute("aria-label", "Ir a " + s.title);
  dot.onclick = () => goTo(i);
  dotsBox.appendChild(dot);
});

function goTo(i) {
  current = Math.max(0, Math.min(i, slides.length - 1));
  track.style.transform = "translateX(-" + current * 100 + "%)";
  [...dotsBox.children].forEach((d, k) => d.classList.toggle("active", k === current));
  prevBtn.disabled = current === 0;
  nextBtn.disabled = current === slides.length - 1;

  textBox.classList.remove("fade");
  void textBox.offsetWidth; // restart the animation
  textBox.innerHTML = "<h2>" + slides[current].title + "</h2><p>" + slides[current].text + "</p>";
  textBox.classList.add("fade");
}

prevBtn.onclick = () => goTo(current - 1);
nextBtn.onclick = () => goTo(current + 1);

document.addEventListener("keydown", e => {
  if (e.key === "ArrowLeft") goTo(current - 1);
  if (e.key === "ArrowRight") goTo(current + 1);
});

let startX = null;
track.addEventListener("touchstart", e => startX = e.touches[0].clientX);
track.addEventListener("touchend", e => {
  if (startX === null) return;
  const diff = e.changedTouches[0].clientX - startX;
  if (Math.abs(diff) > 40) goTo(current + (diff < 0 ? 1 : -1));
  startX = null;
});

goTo(0);
</script>
</body>
</html>
